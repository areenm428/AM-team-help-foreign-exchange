<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1><i class="fas fa-cloud-sun"></i> Weather Dashboard</h1>
                <p>Real-time weather information for your location</p>
            </div>
            <div class="header-controls">
                <button class="btn btn-primary" id="getCurrentLocation">
                    <i class="fas fa-location-dot"></i> Current Location
                </button>
            </div>
        </header>

        <!-- Search Bar -->
        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for a city..."
                    autocomplete="off"
                >
                <button class="btn btn-search" id="searchBtn">
                    <i class="fas fa-search"></i> Search
                </button>
            </div>
            <div class="search-suggestions" id="suggestions"></div>
        </div>

        <!-- Temperature Unit Toggle -->
        <div class="unit-toggle">
            <span>Temperature Unit:</span>
            <label class="switch">
                <input type="checkbox" id="unitToggle">
                <span class="slider"></span>
            </label>
            <span id="unitLabel">°C (Celsius)</span>
        </div>

        <!-- Main Weather Display -->
        <main class="main-content">
            <!-- Current Weather Card -->
            <div class="current-weather-card">
                <div id="currentWeatherContainer" class="loading">
                    <div class="skeleton-loader">
                        <div class="skeleton-text"></div>
                        <div class="skeleton-large"></div>
                        <div class="skeleton-text"></div>
                    </div>
                </div>
            </div>

            <!-- Weather Grid -->
            <div class="weather-grid">
                <!-- Hourly Forecast -->
                <section class="weather-section">
                    <div class="section-header">
                        <h2><i class="fas fa-clock"></i> Hourly Forecast</h2>
                        <div class="filter-buttons">
                            <button class="filter-btn active" data-hours="12">12 Hours</button>
                            <button class="filter-btn" data-hours="24">24 Hours</button>
                        </div>
                    </div>
                    <div id="hourlyForecast" class="hourly-scroll">
                        <!-- Hourly data will be inserted here -->
                    </div>
                </section>

                <!-- 7-Day Forecast -->
                <section class="weather-section">
                    <div class="section-header">
                        <h2><i class="fas fa-calendar"></i> 7-Day Forecast</h2>
                    </div>
                    <div id="weeklyForecast" class="weekly-grid">
                        <!-- Weekly data will be inserted here -->
                    </div>
                </section>
            </div>

            <!-- Weather Details Grid -->
            <section class="weather-section">
                <div class="section-header">
                    <h2><i class="fas fa-info-circle"></i> Weather Details</h2>
                </div>
                <div class="details-grid" id="weatherDetails">
                    <!-- Details will be inserted here -->
                </div>
            </section>

            <!-- Air Quality -->
            <section class="weather-section">
                <div class="section-header">
                    <h2><i class="fas fa-wind"></i> Air Quality</h2>
                </div>
                <div id="airQualityContainer" class="air-quality-container">
                    <!-- Air quality data will be inserted here -->
                </div>
            </section>

            <!-- Chart Section -->
            <section class="weather-section">
                <div class="section-header">
                    <h2><i class="fas fa-chart-line"></i> Temperature Trend</h2>
                </div>
                <div id="chartContainer" class="chart-container">
                    <canvas id="temperatureChart"></canvas>
                </div>
            </section>

            <!-- Saved Locations -->
            <section class="weather-section">
                <div class="section-header">
                    <h2><i class="fas fa-bookmark"></i> Saved Locations</h2>
                </div>
                <div id="savedLocations" class="saved-locations-grid">
                    <!-- Saved locations will be displayed here -->
                </div>
            </section>
        </main>

        <!-- Error Message -->
        <div id="errorMessage" class="error-message"></div>

        <!-- Loading Indicator -->
        <div id="loadingIndicator" class="loading-indicator"></div>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
